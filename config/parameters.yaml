  open_question: {value: "DEC-0027 supersedes the creep explanation: the creep is a rest-pocket jam, not the junction step, and the R6 smooth arc is only 1.5% faster. The servo margin (DEC-0026) was measured with a kv=0.08 dummy actuator and must be re-checked with a real motor model - at full throttle the 25-4 sits at 0.523 of 0.530 N*m stall during the carry. Remaining open items: (1) the feed is phase-sensitive - the ball can creep in the rest pocket for several seconds before a finger grabs it, so the paddle speed must be held inside the drive window and the phase/geometry fix is not yet designed; (2) R5 geometry (two fingers 350/170 + 6.8 mm rest pad) is not yet in CAD; (3) the rigid (non zip-tie) blade and the ASSUMED 0.060 kg ball mass remain open.", status: "TBD"}
