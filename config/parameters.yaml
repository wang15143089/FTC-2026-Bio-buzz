    model: "goBILDA 3100-0012-0020"
    chemistry: "NiMH"
    nominal_voltage: {value: 12.0, unit: "V", status: "KNOWN"}
    capacity: {value: 3000, unit: "mAh", status: "KNOWN_VENDOR"}
    body_envelope:
      length: {value: 124.0, unit: "mm", status: "KNOWN_DRAWING"}
      width: {value: 47.8, unit: "mm", status: "KNOWN_DRAWING"}
      height: {value: 43.0, unit: "mm", status: "KNOWN_DRAWING"}
    lead_length: {value: 120.0, unit: "mm", status: "KNOWN_DRAWING"}
    wire_gauge: {value: 16, unit: "AWG", status: "KNOWN_DRAWING"}
    connector: "XT30 MH-FC"
    fuse: {value: 20, unit: "A", type: "Mini Blade", status: "KNOWN_DRAWING"}
  base_chassis:
    sku: {value: "3209-0001-0007", status: "KNOWN", source: "user supplied STEP and goBILDA"}
    description: "Strafer Chassis Kit, 104mm GripForce mecanum wheels"
    assembled_mass: {value: 4.269, unit: "kg", status: "KNOWN_VENDOR", source: "goBILDA product page"}
    supplied_drive_motors: {value: 4, model: "5203-2402-0019", no_load_speed: 312, speed_unit: "rpm", status: "KNOWN_VENDOR"}
    preserve_wheel_layout: true
    track_width: {value: null, unit: "mm", status: "TBD_MEASURE_FROM_STEP_OR_HARDWARE"}
    wheelbase: {value: null, unit: "mm", status: "TBD_MEASURE_FROM_STEP_OR_HARDWARE"}
    allowed_reconfiguration: "minimum disassembly/reassembly without changing wheel layout, track width, or wheelbase"
    exact_proxy_envelope: {value: null, unit: "mm", status: "TBD_MEASURE_FROM_STEP"}
  motor_envelope_reference:
    sku: {value: "5203-2402-0051", status: "KNOWN", source: "user supplied STEP and goBILDA"}
    gear_ratio: {value: 50.9, unit: ":1", status: "KNOWN_VENDOR"}
    no_load_speed: {value: 117, unit: "rpm", status: "KNOWN_VENDOR"}
    stall_torque: {value: 68.4, unit: "kg.cm", status: "KNOWN_VENDOR"}
    stall_current: {value: 9.2, unit: "A", status: "KNOWN_VENDOR"}
    mass: {value: 0.481, unit: "kg", status: "KNOWN_VENDOR"}
    output_shaft: "8mm REX, 24mm length"
    selection_status: "REFERENCE_ONLY_NOT_SELECTED"
    exact_proxy_envelope: {value: null, unit: "mm", status: "TBD_MEASURE_FROM_STEP"}
  actuator_limits:
    motors: {value: 8, unit: "count", status: "KNOWN", source: "R503"}
    servos: {value: 8, unit: "count", status: "KNOWN", source: "R503"}
