# ---------------------------------------------------------------------------
# 2026-10-12 DEC-0037（R38）：NECTAR 运行夹口重算 82 -> 86 mm。
# 触发：真实调隙舵机（2000-0025-0002）在 82 档对 91.948 mm 球压入 4.97 mm/侧，
# 要靠约 8.6 N*m/轮的摩擦扭矩把球压过夹口，远超 25-4 的真实能力 -> 轮子打滑、
# 球在夹口里「蠕」过（14-21 s），驱动 64-82 % 时间堵转。
# 方法：先按真实连杆机构反解可达夹口，再用 MuJoCo 单球夹口扫参 + 6 相位多球全流程复核。
# 旧的「扎带弹性夹口」假设（r38_v3/v4/v6/v7）无零件号，已 superseded。
# 产物：simulation/mujoco/out/_r38_v8n86.json, _r38_gap_recalc.json
# ---------------------------------------------------------------------------
