schema_version: "0.1"
project:
  name: "FTC robot project"
  design_version: "requirements-v0.1"
  default_geometry_unit: "mm"
  parameter_status: "MIXED"

coordinate_system:
  handedness: "right"
  positive_x: "robot_forward"
  positive_y: "robot_left"
  positive_z: "up"
  origin_definition: "nominal drivetrain contact plane at geometric center of wheel-track envelope"
  origin_status: "PROVISIONAL"

robot:
  season: {value: "2026-2027 BIOBUZZ", status: "KNOWN", source: "Competition Manual TU01"}
  starting_envelope:
    x: {value: 457.0, unit: "mm", status: "KNOWN", source: "R102"}
    y: {value: 457.0, unit: "mm", status: "KNOWN", source: "R102"}
    z: {value: 457.0, unit: "mm", status: "KNOWN", source: "R102"}
  operating_envelope:
    horizontal_a: {value: 457.0, unit: "mm", status: "KNOWN", source: "R105"}
    horizontal_b: {value: 610.0, unit: "mm", status: "KNOWN", source: "R105"}
    vertical: {value: 736.5, unit: "mm", status: "KNOWN", source: "R105"}
    orientation_note: "vertical is always normal to field surface; horizontal axes may rotate with robot"
  frame_width: {value: null, unit: "mm", status: "TBD", source: null}
  frame_length: {value: null, unit: "mm", status: "TBD", source: null}
  maximum_mass: {value: null, unit: "kg", status: "NO_EXPLICIT_RULE_LIMIT", source: "R104"}
  controlled_gamepiece_limit: {value: 4, unit: "count", status: "KNOWN", source: "G407"}

field:
